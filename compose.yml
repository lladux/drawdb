services:
  drawdb:
    image: node:20-alpine
    container_name: drawdb
    ports:
      - 5173:5173
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    networks:
      - default

  server:
    build: ./server
    container_name: drawdb-server
    ports:
      - 5000:5000
    env_file:
      - ./server/.env
    networks:
      - default

networks:
  default:
    driver: bridge
