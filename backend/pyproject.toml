# Dependencies are listed in requirements.txt and requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# flake8-builtins: a method named like a builtin (e.g. `list`) shadows it in later
# annotations of the same class, which breaks on Python < 3.14.
extend-select = ["A"]

# Lets `fastapi dev` / `fastapi run` find the app without arguments.
[tool.fastapi]
entrypoint = "app.asgi:app"
